name: CI

on:
  pull_request:
  push:
    branches: [ master ]

env:
  CI_CHECK_FAIL: ssh2
  OPENSSL_CONF: /dev/null

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      # "localhost" resolves to ::1 first inside the container, but IPv6
      # connections to it fail there, so make tests bind/connect via IPv4
      NODE_OPTIONS: --dns-result-order=ipv4first
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - 24.x
        - 26.x
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ make python3 openssh-client xz-utils
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check Node.js version
        run: node -pe process.versions
      - name: Check npm version
        run: npm -v
      - name: Install module
        run: npm install
      - name: Run tests
        run: npm test
